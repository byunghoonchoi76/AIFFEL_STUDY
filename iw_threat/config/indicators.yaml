      - {id: I_SUB_SORTIE,   name: 잠수함정·공기부양정 기지 이탈, lr: 7.0, tau_days: 3, equipment: [submarine, hovercraft, semi_submersible], min_delta: 1, meaning: 해상 침투 준비 정황}
      - {id: I_POSTURE_JD,   name: 합참·연합사 진돗개 상향 판단, lr: 2.5, tau_days: 30, equipment: [], min_delta: 0, meaning: 상급 판단 반영 (참고 조건)}
      - {id: I_WX_COVER,     name: 저시정 은밀 침투 유리 여건,     lr: 1.3, tau_days: 2, equipment: [], min_delta: 0, meaning: 감시 곤란 기상 (의도 근거 아님)}
      - {id: I_INFIL_SIGN,   name: 침투 흔적·거동 수상자,        lr: 9.0, tau_days: 3, equipment: [tunnel_exit], min_delta: 1, meaning: 침투 진행 정황}

  # 두루미(적 항공기 위협) 트랙용 — 예시값
