      - {id: I_AIR_SORTIE,   name: 비행 활동 급증,               lr: 4.0, tau_days: 2, equipment: [], min_delta: 0, meaning: 항공 위협 고조}
      - {id: I_AIR_DEFENSE,  name: 방공 자산 전방 배치,          lr: 2.0, tau_days: 7, equipment: [sam, aaa, group:air_defense], min_delta: 2, meaning: 공격 부대 방공 엄호 정황}

