# 위협징후목록 (샘플) — 공개 교리 일반론 기반 예시값. 정보사 목록 확보 시 이 파일만 교체.
# lr      : 우도비 P(징후|가설 참) / P(징후|평시). 1보다 클수록 진단력 높음, 평시 흔한 징후는 1에 가깝게.
# tau_days: 시의성 감쇠 시간상수(일). 관측 후 tau_days가 지나면 가중치가 약 37%로 감소.
# equipment: 영상 판독 표적 종류와 매칭되는 장비 분류 코드
# min_delta: 기준기간 대비 증가 수량 임계값(영상 규칙 매칭용)
# meaning  : 징후의 군사적 의미(분석관 관리). LLM 해석이 검증을 통과하지 못하면 이 문구를 사용

meta:
  version: "0.1-sample"
  basis: "공개 교리 일반론 기반 예시 (실제 운용값 아님)"

# 영상 임계값: min_delta는 지역 단위 기준. 부대별 기준선(전투서열 적재 시)에서는 제대에 맞게 조정
thresholds:
  echelon_scale: {군단: 1.5, 사단: 1.0, 여단: 0.5, 연대: 0.3, 대대: 0.2, 중대: 0.1}   # min_delta × 배율 (올림, 최소 1)
  unit_min_ratio: 2.0    # 평시 대비 2배 이상 + 증가량이 임계값의 절반 이상이면 충족
  min_zscore: 3.0        # 증가량이 평시 표준편차의 3배 이상일 때만 (평시 관측 3회 이상일 때 적용)
  weak_signal: {fraction: 0.5, zscore: 2.0, scale: 0.5, min_obs: 2}   # 임계값 절반 이상·표준편차 2배 이상·최근 2회 이상 관측 → 가중치 절반의 약한 신호
# 지표별로 제대 값을 직접 지정하려면: min_delta_by_echelon: {여단: 6, 대대: 3}  (배율보다 우선)

grades:            # 위협 점수 → 등급 (하한값 기준, 내림차순)
  - {name: 심각, min: 0.75}
  - {name: 경계, min: 0.50}
  - {name: 주의, min: 0.25}
  - {name: 관심, min: 0.0}

hypotheses:
  - id: H_ATTACK
    name: 공격 준비
    prior: 0.02
    impact: 1.0
    indicators:
      - {id: I_ARMOR_MASS,   name: 기갑·기계화 장비 전방 집결, lr: 6.0, tau_days: 7,  equipment: [tank, ifv, apc, group:main_battle_tank, group:light_armor], min_delta: 10, meaning: 공격 제대 집결 정황, min_delta_by_echelon: {여단: 6, 대대: 3}}
      - {id: I_BRIDGING,     name: 도하·공병 장비 전방 이동,   lr: 8.0, tau_days: 7,  equipment: [bridging, engineer, group:engineer], min_delta: 2, meaning: 하천 도하 공격 대비 정황}
      - {id: I_ARTY_POS,     name: 포병 진지 점령·증강,       lr: 5.0, tau_days: 5,  equipment: [artillery, mlrs, group:artillery], min_delta: 4, meaning: 공격준비사격 대비 정황}
      - {id: I_LOGISTICS,    name: 보급·유류 차량 증가,       lr: 2.5, tau_days: 10, equipment: [truck, fuel_truck, supply_point], min_delta: 20, meaning: 작전 지속지원 준비 정황}
      - {id: I_MEDICAL,      name: 야전 의무시설 전개,        lr: 7.0, tau_days: 10, equipment: [field_hospital], min_delta: 1, meaning: 대규모 사상자 대비 의무지원 준비 정황}
      - {id: I_COMMAND_POST, name: 전방 지휘소 전개,          lr: 4.0, tau_days: 7,  equipment: [command_vehicle, command_post], min_delta: 2, meaning: 전방 작전 지휘체계 구축 정황}
      - {id: I_AIR_DEFENSE,  name: 방공 자산 전방 배치,       lr: 3.5, tau_days: 7,  equipment: [sam, aaa, group:air_defense], min_delta: 2, meaning: 공격 부대 방공 엄호 정황}
      - {id: I_PATTERN_DEV,  name: 평시 훈련 패턴과 상이한 활동, lr: 3.0, tau_days: 14, equipment: [], min_delta: 0, meaning: 평시 활동과 다른 이상 활동}
      # classes.yaml 연계 지표 (ATP 7-100.2 기반 시나리오) — 예시값
      - {id: I_DISPERSAL,    name: 주둔지 이탈·야간 분산 이동,  lr: 3.5, tau_days: 7, equipment: [march_column, camouflaged], min_delta: 2, meaning: 은밀 전개 정황}
      - {id: I_SYNC_CONCEAL, name: 다수 부대 동시 은밀 전개,     lr: 6.0, tau_days: 5, equipment: [], sync_of: I_DISPERSAL, min_units: 2, meaning: 협조된 공격 준비 정황}
      - {id: I_HARTS_OCC,    name: 갱도포병진지 점유,          lr: 7.0, tau_days: 10, equipment: [harts@occupied], min_delta: 2, meaning: 화력 운용 준비 정황}
      - {id: I_DECEPTION_ACT, name: 기만체·가짜 진지 조성,     lr: 1.5, tau_days: 10, equipment: [group:deception], min_delta: 3, meaning: 의도 은폐 활동}
      - {id: I_EW_DEPLOY,    name: 전자전·통신 차량 전개,      lr: 3.0, tau_days: 5, equipment: [ew_vehicle], min_delta: 2, meaning: 전자전 공격 준비 정황}
      - {id: I_ASSAULT,      name: 공격대형·화력준비 진지 형성, lr: 12.0, tau_days: 2, equipment: [formation_wedge_v_line, artillery_position], min_delta: 2, meaning: 공격 개시 정황}
      # 반대 징후 (lr < 1: 공격 가능성을 낮춤). discounts: 이 반대 증거가 신뢰를 깎는 대상 지표
      - {id: I_POSTURE_WC,   name: 합참·연합사 워치콘 상향 판단, lr: 2.0, tau_days: 30, equipment: [], min_delta: 0, meaning: 상급 정보판단 반영 (참고 조건)}
      - {id: I_POSTURE_DC,   name: 합참·연합사 데프콘 상향 판단, lr: 3.0, tau_days: 30, equipment: [], min_delta: 0, meaning: 상급 작전판단 반영 (참고 조건)}
      - {id: I_CHEM_PREP,    name: 화학부대·화학정찰·제독 장비 전방 이동, lr: 2.0, tau_days: 7, equipment: [chem_vehicle, decon_vehicle], min_delta: 2, meaning: 공격 시 중요시설 무력화용 화학 운용 준비 정황}
      - {id: I_KEY_TARGET,   name: 핵심표적 활동(합참·연합사 표적목록), lr: 3.0, tau_days: 7, equipment: [], min_delta: 0, meaning: 지휘관 우선 표적의 활동 — 위협 평가 핵심 기준}
      - {id: I_HV_TARGET,    name: 고가치표적 활동(합참·연합사 표적목록), lr: 2.0, tau_days: 7, equipment: [], min_delta: 0, meaning: 고가치 표적의 활동}
      - {id: I_WX_WINDOW,    name: 공격 적합 기상·지면 여건,      lr: 1.5, tau_days: 3, equipment: [], min_delta: 0, meaning: 기상 여건상 공격 시기로 유리 (의도 근거 아님)}
      - {id: C_WX_NOGO,      name: 공격 불리 기상·지면 여건,      lr: 0.7, tau_days: 3, equipment: [], counter: true, meaning: 기상 여건상 대규모 지상 공격 곤란 (기만·지연 가능성 병행 검토)}
      - {id: C_DECOY,        name: 모형·위장 장비 식별,          lr: 0.2,  tau_days: 10, equipment: [], counter: true, discounts: [I_ARMOR_MASS, I_BRIDGING, I_ARTY_POS], discount_factor: 0.7, meaning: 기만 전시 가능성}
      - {id: C_NO_LOGISTICS, name: 보급·연료 지원 부재,          lr: 0.35, tau_days: 7,  equipment: [], counter: true, meaning: 공격 지속능력 미비}
      - {id: C_NORMAL_COMMS, name: 통신·지휘망 평시 수준,        lr: 0.4,  tau_days: 5,  equipment: [], counter: true, meaning: 작전 지휘 활동 미식별}
      - {id: C_RETURN,       name: 부대 복귀·활동 종료 정황,     lr: 0.3,  tau_days: 7,  equipment: [], counter: true, meaning: 활동 종료 정황}

  - id: H_EXERCISE
    name: 대규모 훈련
    prior: 0.10
    impact: 0.2
    indicators:
      - {id: I_ARMOR_MASS,   name: 기갑·기계화 장비 전방 집결, lr: 3.0, tau_days: 7,  equipment: [tank, ifv, apc], min_delta: 10, meaning: 공격 제대 집결 정황}
      - {id: I_LOGISTICS,    name: 보급·유류 차량 증가,       lr: 2.0, tau_days: 10, equipment: [truck, fuel_truck, supply_point], min_delta: 20, meaning: 작전 지속지원 준비 정황}
      - {id: I_EX_ANNOUNCED, name: 훈련 공표·통상 훈련 시기,   lr: 6.0, tau_days: 30, equipment: [], min_delta: 0, meaning: 통상 훈련 활동 가능성}
      - {id: C_RETURN,       name: 부대 복귀·활동 종료 정황,     lr: 2.0, tau_days: 7, equipment: [], meaning: 훈련 종료 후 복귀 정황}   # 훈련 가설에는 지지 증거

