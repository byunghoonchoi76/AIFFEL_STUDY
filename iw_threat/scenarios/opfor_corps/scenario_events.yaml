  - {id: E2-3, phase: P2, unit: [light_inf_bde_1], action: 땅굴 출구 병력 출현, ref: "ATP 6-148~6-150", classes: [tunnel_exit], layout: tunnels, sensors: [EO]}
  - {id: E2-4, phase: P2, unit: [light_inf_bde_1], action: 공중강습·공정 3단계, ref: "ATP B-14", classes: [aircraft_an2, helicopter_md500], layout: airborne, sensors: [EO]}
  - {id: E2-5, phase: P2, unit: [light_inf_bde_1], action: 특수전부대 분산공격 (후방 지휘·군수), ref: "ATP 6-71~6-72", classes: [command_post, supply_point], sensors: [EO]}
