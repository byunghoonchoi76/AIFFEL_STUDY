  - {id: E4-2, phase: P4, unit: [recon_bn_1], action: 전투전초·관측소, ref: "ATP 7-36", classes: [recon_brdm2], layout: defense.security_zone, sensors: [EO]}
  - {id: E4-3, phase: P4, unit: [inf_div_1], action: 대전차 방어체계, ref: "ATP 7-43, 7-49", classes: [tank_t55], layout: defense, sensors: [EO]}
  - {id: E4-4, phase: P4, unit: [corps_arty_grp, inf_div_1, inf_div_2], action: 포병 종심 배치, ref: "ATP A-16", classes: [mortar_120, artillery_position], layout: fires_positions.defense, sensors: [SAR]}
  - {id: E4-5, phase: P4, unit: [tank_bde_1], action: 전차연대 역습 대기, ref: "ATP C-12, 7-58", classes: [tank_t62_chonma], layout: armor, sensors: [SAR]}
