  - {id: E3-2, phase: P3, unit: [mech_div_1], action: 측위 경계, ref: "ATP 5-141", classes: [march_column], layout: march_column.flank_guard, sensors: [SAR]}
  - {id: E3-3, phase: P3, unit: [engr_rgt_bridge, mech_div_1], action: 하천 도하 (연막 병행), ref: "ATP F-12~F-15, G-10", classes: [bridge_pmp, ferry_gsp_k61], layout: river_crossing, sensors: [SAR]}
