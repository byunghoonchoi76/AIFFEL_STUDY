# 연속 시나리오: 국면과 이벤트
# time: D-day 기준 일(D), H-hour 기준 시간(H). classes는 classes.yaml id, layout은 layout_rules.yaml 경로.
schema_version: 1
strategy_baseline: realistic_strategy      # STRAT2026 현실적 군사전략
strategy_excursion: target_strategy        # 목표 군사전략 (ISR·C2 통합 강화 변형)
environment:
  night_movement: true                     # A-12
  adverse_weather_share: 0.3               # 시험 설계값
phases:
  - id: P0
    name_ko: 평시 기준선
    window: [D-30, D-15]
  - id: P1
    name_ko: 전쟁 준비·위기 고조
    window: [D-14, D-1]
  - id: P2
    name_ko: 개전·돌파
    window: [H, H+24]
  - id: P3
    name_ko: 종심 공격·전과확대
    window: [H+24, D+5]
  - id: P4
    name_ko: 방어 전환·역습
    window: [D+5, D+10]
  - id: P5
    name_ko: 전술핵 위협·제한핵전 분기
    window: [after_P2, D+10]
    branch: true
  - id: PCS
    name_ko: 대안정화 행동
    window: [D-14, D+10]
    concurrent: true

events:
  # ---------------- P0 ----------------
  - {id: E0-1, phase: P0, unit: [inf_div_1, inf_div_2, mech_div_1], action: 주둔지 정상 활동, ref: "ATP 3장", classes: [truck, ifv_apc, tank_t55], signature: 차량 수·배열의 기준 패턴, sensors: [EO]}
  - {id: E0-2, phase: P0, unit: [corps_arty_grp, inf_div_1, inf_div_2], action: HARTS·CBP·축성 전차호·Y형 벙커 비점유, ref: "ATP 7-86~7-96", classes: [harts, cbp_strongpoint, fortified_tank_position, y_bunker], state: unoccupied, layout: fortifications, sensors: [EO, SAR]}
  - {id: E0-3, phase: P0, unit: [], action: 비행장 지하 격납고 운용, ref: "ATP 7-101~7-102", classes: [ugf_entrance], layout: fortifications.airfield_dispersal_tunnel, sensors: [EO]}
  - {id: E0-4, phase: P0, unit: [missile_bn_1], action: 미사일 지하기지 출입 통제, ref: STRAT2026, classes: [ugf_entrance], state: no_activity, sensors: [EO, SAR]}
  # ---------------- P1 ----------------
  - {id: E1-1, phase: P1, unit: [inf_div_1, inf_div_2, mech_div_1], action: 주둔지 이탈·분산 야간 이동, ref: "ATP A-12, 1-75", classes: [march_column, truck, camouflaged], sensors: [SAR, EO], night: true}
  - {id: E1-2, phase: P1, unit: [corps_arty_grp], action: HARTS 점유, ref: "ATP 7-87~7-91", classes: [harts, truck, aaa_zpu4], state: occupied, layout: fortifications.harts, sensors: [SAR]}
  - {id: E1-3, phase: P1, unit: [tank_bde_1], action: 전차여단 집결지 전개, ref: "ATP C-10", classes: [tank_t62_chonma, tank_pokpung, tank_songun, tank_new_gen, light_tank, ifv_apc, sp_howitzer_122_152], layout: armor, sensors: [EO, SAR]}
  - {id: E1-4, phase: P1, unit: [missile_bn_1], action: TEL 지하기지 출고·분산 (기만 TEL 동반), ref: "STRAT2026, ATP 9-41", classes: [tel_srbm, missile_support_vehicle, decoy], layout: deception, sensors: [SAR, EO]}
  - {id: E1-5, phase: P1, unit: [deception_unit_1], action: 가짜 방어진지·가짜 기동로 조성, ref: "ATP 9-39~9-42", classes: [decoy], layout: deception, sensors: [EO, SAR]}
  - {id: E1-6, phase: P1, unit: [light_inf_bde_1], action: 경보병·특수전부대 전방 집결, AN-2 활동, ref: "ATP I장, B-13", classes: [aircraft_an2, helicopter_md500], sensors: [EO]}
  - {id: E1-7, phase: P1, unit: [ad_units], action: 방공부대 전개, ref: "ATP D-6", classes: [aaa_zpu4, aaa_zu23_2, spaag_zsu234, aaa_s60_37mm, sam_launcher, radar, ad_cluster], layout: air_defense, sensors: [EO, SAR]}
