  - {id: T-ORG-2, domain: force_structure, ref: "ATP 3장", scene: 전차여단 vs 기계화사단, layout: orbat.tank_brigade, task: 장비 구성비로 부대 유형 분류, metrics: [M2-echelon], linked_events: [E1-3]}
  - {id: T-ORG-3, domain: command_post, ref: "ATP 3장", scene: 주·전방·예비 지휘소, task: 지휘소 탐지·우선순위, metrics: [M1-detect], linked_events: [E2-5]}
