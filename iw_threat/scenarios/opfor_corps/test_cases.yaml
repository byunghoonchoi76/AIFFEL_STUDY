# 분야별 세부 시험 시나리오와 평가지표
# vary: 반복 시험 시 하나씩 바꾸는 변수. linked_events: scenario_events.yaml id.
schema_version: 1
default_vary: [spacing_jitter, camouflage, weather, gsd_m, look_angle]

metrics:
  M1-detect:      {stage: equipment,  name_ko: 클래스별 탐지, measure: mAP@0.5, target: {EO: 0.80, SAR: 0.70}}
  M1-identify:    {stage: equipment,  name_ko: 기종 식별, measure: top1_accuracy, target: 0.85}
  M1-robust:      {stage: equipment,  name_ko: 야간·악천후 강건성, measure: drop_vs_day_EO_pp, target_max: 10}
  M2-echelon:     {stage: layout,     name_ko: 제대 추정, measure: accuracy, target: 0.80}
  M2-formation:   {stage: layout,     name_ko: 대형·기동 형태 분류, measure: macro_f1, target: 0.75}
  M2-defline:     {stage: layout,     name_ko: 방어선 추론, measure: position_error_km, target_max: 1.0}
  M3-occupancy:   {stage: change,     name_ko: 점유 판별, measure: accuracy, target: 0.85}
  M3-warning:     {stage: change,     name_ko: 징후 조기경보, measure: revisits_to_detect, target_max: 2}
  M3-tel:         {stage: change,     name_ko: TEL 추적, measure: {recall: 0.70, position_error_m_max: 50}}
  M4-decoy:       {stage: deception,  name_ko: 기만체 판별, measure: decoy_as_real_rate, target_max: 0.20}
  M4-camouflage:  {stage: deception,  name_ko: 위장 표적, measure: recall, target: 0.60}
  M4-clutter:     {stage: deception,  name_ko: 민간 클러터 오탐, measure: false_alarms_per_km2, target_max: 0.1}
# 목표치는 초기 제안값이며 시험 주관 기관과 협의해 확정

