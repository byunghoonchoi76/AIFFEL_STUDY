# 표적 배치 생성 규칙 (교범 수치 = 기본 범위, 단위 m 또는 km 명시)
# 합성 장면 생성기가 range의 균등분포에서 샘플링하는 것을 가정. terrain_jitter는 지형에 따른 추가 변동 비율.
schema_version: 1
terrain_jitter: 0.2

test_area:
  size_km: [60, 100]          # 동서 x 남북
  boundary: virtual_mdl
  dmz_width_km: 4
  river_width_m: 150
  features: [ridgelines, river, urban_area, coastline, airfield, rail_yard]

attack_frontage_km:           # ATP7-100.2 Table 2-1
  army:      {frontage: [40, 60], depth: [80, 100]}
  corps:     {frontage: [20, 40], depth: [40, 50]}
  division:  {frontage: [10, 16], depth: [10, 15]}
  regiment:  {frontage: [3, 6],   depth: [5, 7]}
  battalion: {frontage: [1.5, 2], depth: [2, 3]}

offensive_maneuver:           # 6-14, 6-15
  penetration:
    corridor_width_km: [2, 3]
    tubes_per_km: [50, 80]
    tubes_per_km_dmz_initial: [150, 180]
  thrust:
    assault_width_m: [600, 800]
    assault_width_max_m: 1000
    supporting_tubes: [110, 150]
  artillery_prep_min: [10, 30]          # A-13
  artillery_displacement: by_thirds     # A-14

march_column:                 # 5-138, 5-141
  advance_guard:
    scout_to_point_platoon_m: [300, 600]
    point_to_lead_battalion_km: [3, 6]
    lead_battalion_to_regiment_km: [2, 3]
  flank_guard:
    offset_from_main_body_km: [2, 4]
    point_to_battalion_km: 1

small_unit_formations_m:      # 6-33 ~ 6-40
  company:
    wedge:  {inter_platoon: [150, 200]}
    v:      {lead_platoon_gap: [300, 350], trail_offset: [150, 200]}
    line:   {inter_platoon: [150, 200], heavy_weapons_trail: [150, 200]}
  platoon:
    wedge:  {trail_squad_offset: [75, 100], trail_squad_gap: 50}
    v:      {inter_squad: 100}
    line:   {inter_squad: 50}
  platoon_assault:
    deploy_distance: 900
    skirmish_line_width: 150
    final_assault_line: 100
    on_line_distance: 150

armor:                        # C-10, C-12
  assembly_area_from_enemy_km: [9, 14]
  line_of_departure_from_flot_km: [1, 3.5]
  defense_armor_regiment_depth_km: [10, 15]

defense:                      # 2-9, 7-35 ~ 7-58
  security_zone:
    width_km: [16, 20]
    depth_km: [10, 15]
    general_security_area_km: [10, 15]
    combat_security_area_km: [1, 2]
    direct_security_m: [200, 400]
    combat_ops_per_platoon_plus: [3, 4]
  defense_zones:
    count: 3
    zone_depth_km: [10, 15]
    buffer_depth_km: [4, 6]
    division_first_zone_frontage_km: [16, 20]
  division_echelon: two_up_one_back
  regiment_frontage_km: [8, 10]
  battalion_frontage: half_of_regiment
  obstacle_belt_depth_m: [400, 1000]
  final_protective_fire_m: 300
  counterattack_position_behind_penetration_km: 1
  division_at_reserve_companies: 2

fires_positions:              # A-12, A-16, 7-45~7-47
  offense_battery_behind_front_m: [500, 1000]
  defense:
    mortar_behind_front_m: [300, 800]
    mortar_below_crest_m: 10
    mortar_slope: reverse
    regimental_artillery_group_km: [5, 7]
    division_artillery_group_km: [5, 10]
    corps_artillery_group_km: [10, 15]
  company_target_m: {width: 100, depth: 900}
  rolling_barrage_m: {forward_of_bp: 2000, width: [400, 700], step: [500, 800], max_repeats: 4}
  rectangular_fire_m: {width: [400, 700], depth: [300, 500]}

air_defense:                  # D-6
  weapon_spacing_m: [50, 100]
  unit_separation_min_m: 200
  siting: high_ground
  patterns: [linear, fan, triangular, square]

fortifications:               # 7-86 ~ 7-102
  harts:
    guns_per_site: [3, 8]
    passage_m: [2, 3]
    lining_cm: [20, 40]
    prime_movers: covered_nearby
    ad_protection: [zpu2, zpu4]
  infantry_strongpoint_north_of_dmz_m: [200, 1000]
  strongpoint_tunnels: 3
  airfield_dispersal_tunnel:
    distance_from_runway_km: [1, 2]
    width_m: 14
    height_m: 10
    length_max_m: 600

airborne:                     # B-14
  insertion_depth_km: {likely: [14, 19], max: 48}
  follow_on_echelon_h: [4, 6]

river_crossing:               # F-12 ~ F-15
  ferry_gap_m: [120, 180]
  bridge_gap_min_m: 180
  gsp_assembly_min: {day: 20, night: [30, 40]}

obscurants:                   # G-11
  tank_smoke_canister_area_m2: [4000, 5000]

tunnels:                      # Table 6-1
  exit_south_of_mdl_m: [435, 1100]
  depth_m: [45, 160]
  height_m: [1.2, 2.0]
  width_m: [0.9, 2.6]

deception:                    # 9-35 ~ 9-42 (비율은 시험 설계값)
  decoy_to_real_ratio: [1, 3]
  signatures_suppressed: [thermal, emission, logistics_tracks]
