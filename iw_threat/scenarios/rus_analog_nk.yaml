# 합성 시나리오: 러시아 2021~22 우크라이나 침공 전 집결 패턴(공개 관측 기록)을 북한군 공격 전술로 묘사
# - 타임라인: 러시아 사례의 단계·순서를 따르되 전반부(1·2차 증강)는 압축, 공격 전 40일은 실제 간격 유지
# - 부대·좌표·수량: 모두 가상 (실제 북한군 부대·위치와 무관), 장비 유형은 북한군 공격 전술(ATP 7-100.2) 기준
# - imagery: 각 단계를 묘사할 때 참고하는 러시아 사례 공개 영상 (시스템 입력 아님, 좌표는 공개 보도 기반 근사치 → Copernicus Browser에서 확인)
# - 작성 원칙: 위협징후목록·우도비를 보지 않고 '부대 활동'과 '관측 사실'만 기술 (평가 순환 방지)
id: rus_analog_nk
name: 러시아 사례 기반 북한군 공격 준비
area_id: SIM-RUSNK
truth:
  intent: 공격
  hypothesis: 공격 준비
  d_day: "D일 = 공격 개시 (러시아 사례 2022.2.24에 대응)"
  # 정답 태세 일정 [시작일, 단계] — 분석관 작성 예시 (2차 증강 장기화 확인 시 워치콘 2, 기만 철수 발표에도 증강 지속 확인 시 워치콘 1)
  readiness: {watchcon: [[-120, 3], [-45, 2], [-8, 1]], defcon: [[-120, 4], [-8, 3], [-2, 2]], jindogae: [[-120, 3]], durumi: [[-120, 3]]}
period: {start: -170, end: 0}
assess: {start: -120, end: 0}

noise:
  p_observe: 0.75          # 동계 기상·재방문 제약
  count_rel_sd: 0.12
  p_miss: 0.10
  false_positive_rate: 0.03
  position_sd_m: 200
  p_sar_on_cloudy: 0.4     # 광학 불가일(운량 70% 이상·강수)에 SAR 촬영이 이뤄질 확률 — 나머지는 관측 공백

